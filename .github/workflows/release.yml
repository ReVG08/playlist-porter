name: Build desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run desktop:bundle
      - name: Build macOS installers
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg zip --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      - name: Build Windows installers
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis portable --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: playlist-porter-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Playlist Porter $GITHUB_REF_NAME — Desktop Edition" --notes "Desktop applications for macOS (Apple Silicon and Intel) and Windows x64 (installer and portable). Includes local OAuth, encrypted local token storage, ordered playlist transfers, match review, and an in-app tutorial. Source available under PolyForm Noncommercial 1.0.0; commercial use requires the creator's written permission. These community builds are unsigned. See the README for installation, developer credential setup, privacy details, and the step-by-step tutorial."
        env:
          GH_TOKEN: ${{ github.token }}
